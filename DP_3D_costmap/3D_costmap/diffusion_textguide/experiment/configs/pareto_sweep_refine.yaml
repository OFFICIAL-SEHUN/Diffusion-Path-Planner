# ─────────────────────────────────────────────────────────
# Exp 1b — Refined Pareto sweep (2nd stage, ~625 combos)
# ─────────────────────────────────────────────────────────
# Coarse-stage best (from results/pareto/pareto_summary.txt):
#   α*=0.5, β*=2.0, γ*=1.0, δ*=2.0
#   utopia_dist=0.6376, min_ISR=0.7383, mean_ISR=0.8932
#
# Grid: center ± 0.5 with step 0.25 → 5 values per axis.
# 5⁴ = 625 combos × 50 terrains × 12 intents.
#
# Run:
#   python -m experiment.evaluators.pareto \
#       --config experiment/configs/pareto_sweep_refine.yaml \
#       --output-dir results/pareto_refine
# ─────────────────────────────────────────────────────────

terrain:
  num_terrains: 50              # coarse보다 더 많은 터레인으로 통계 신뢰도↑
  img_size: 100
  height_range: [0, 5]
  terrain_scales: [[20, 10], [10, 5], [5, 2]]
  limit_angle_deg: 25
  pixel_resolution: 0.5
  max_iterations: 20000

# Center = (α*=0.5, β*=2.0, γ*=1.0, δ*=2.0) from coarse best.
# Each axis: center ± 0.5, step 0.25 → 5 values (all ≥ 0, no clipping needed)
# 5 × 5 × 5 × 5 = 625 combos
sweep:
  alpha: [0.00, 0.25, 0.50, 0.75, 1.00]  # α* = 0.5
  beta:  [1.50, 1.75, 2.00, 2.25, 2.50]  # β* = 2.0
  gamma: [0.50, 0.75, 1.00, 1.25, 1.50]  # γ* = 1.0
  delta: [1.50, 1.75, 2.00, 2.25, 2.50]  # δ* = 2.0

intents:
  - baseline
  - left_bias
  - right_bias
  - center_bias
  - avoid_steep
  - prefer_flat
  - energy_efficient
  - left_bias+avoid_steep
  - right_bias+prefer_flat
  - center_bias+prefer_flat

horizon: 120
risk_threshold_deg: 15.0
seed: 42
num_workers: 8           # ProcessPoolExecutor workers (CPU count on this machine)

balanced_selection:
  enabled: true
  feasibility_min: 0.90
  isr_min: 0.70
