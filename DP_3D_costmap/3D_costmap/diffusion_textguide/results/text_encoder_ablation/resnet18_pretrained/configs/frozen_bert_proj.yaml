project_name: DiffusionTextGuide_ResNet_frozen_bert_proj
seed: 42
data:
  img_size: 100
  horizon: 120
  num_samples: 100
  paths_per_terrain: 100
  cost_weight: 50.0
  min_distance_factor: 1.5
gradient:
  height_range:
  - 0
  - 5
  terrain_scales:
  - - 20
    - 10
  - - 10
    - 5
  - - 5
    - 2
  mass: 10.0
  gravity: 9.8
  limit_angle_deg: 25
  pixel_resolution: 0.5
  max_iterations: 20000
intent:
  cost_weights:
    alpha: 0.5
    beta: 1.8
    gamma: 0.4
    delta: 2.0
  risk_threshold_deg: 15.0
diffusion:
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.02
model:
  base_dim: 64
  time_embed_dim: 256
  image_feat_dim: 256
  visual_backbone: resnet
  timm_model_name: resnet18
  timm_pretrained: true
  text_encoder_type: bert_proj
  text_encoder:
    type: bert_proj
    model_name: bert-base-uncased
    batch_size: 64
training:
  epochs: 500
  batch_size: 128
  learning_rate: 3.0e-05
  checkpoint_dir: checkpoints/text_encoder_ablation/resnet18_pretrained/frozen_bert_proj
  model_name: diffusion_textguide_frozen_bert_proj.pt
  log_interval: 100
  use_amp: true
inference:
  show_progress: true
logging:
  val_loss_interval: 100
  val_interval: 100
  val_max_samples: 50
  log_dir: logs/text_encoder_ablation/frozen_bert_proj
