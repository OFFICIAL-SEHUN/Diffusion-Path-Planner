base_config: configs/resnet.yaml
data_dir: data/raw
val_dir: data/valid
device: cuda

output_dir: results/text_encoder_ablation/resnet18_pretrained_fresh_5000
generated_config_dir: results/text_encoder_ablation/resnet18_pretrained_fresh_5000/configs

wandb:
  project: diffusion-textguide-text-encoder-ablation-5000
  group: resnet18_pretrained_fresh_5000

# =============================================================================
#usage : python3 -m experiment.runners.text_encoder_ablation --config experiment/configs/text_encoder_ablation.yaml
epochs: 5000
batch_size: 128
val_loss_interval: 100
val_interval: 1000
train_val_seed: 42
train_val_samples_per_intent: 50
train_val_num_seeds: 1

# Use the full validation instruction set for train-time metrics and final eval.
# No train_val_max_samples / train_val_samples_per_intent / eval_max_samples /
# eval_samples_per_intent cap is set here.
eval_seed: 42
eval_num_seeds: 3

encoders:
  - name: no_text
    type: no_text

  - name: onehot_intent
    type: onehot

  - name: frozen_clip
    type: clip
    model_name: openai/clip-vit-base-patch32

  - name: frozen_clip_proj
    type: clip_proj
    model_name: openai/clip-vit-base-patch32

  - name: frozen_bert_proj
    type: bert_proj
    model_name: bert-base-uncased

  - name: frozen_t5_proj
    type: t5_proj
    model_name: t5-base
