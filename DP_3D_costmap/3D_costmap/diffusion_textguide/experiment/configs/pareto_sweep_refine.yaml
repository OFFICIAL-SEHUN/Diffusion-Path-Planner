# ─────────────────────────────────────────────────────────
# Exp 1b — Refined Pareto sweep (2nd stage, ~625 combos)
# ─────────────────────────────────────────────────────────
# Run AFTER the coarse sweep finishes. Update the (α*, β*, γ*, δ*) center
# below to the coarse-stage best (from results/pareto/pareto_summary.txt),
# then this file expands ±0.5 around it with 0.25 steps (5 values per axis).
#
# Below grid is a placeholder centered at (1.0, 1.0, 0.5, 2.0) — replace
# after seeing coarse results. 5⁴ = 625 combos × 50 terrains × 12 intents.
#
# Run:
#   python -m experiment.evaluators.pareto \
#       --config experiment/configs/pareto_sweep_refine.yaml \
#       --output-dir results/pareto_refine
# ─────────────────────────────────────────────────────────

terrain:
  num_terrains: 50              # coarse보다 더 많은 터레인으로 통계 신뢰도↑
  img_size: 100
  height_range: [0, 5]
  terrain_scales: [[20, 10], [10, 5], [5, 2]]
  limit_angle_deg: 25
  pixel_resolution: 0.5
  max_iterations: 20000

# Placeholder (center = (1.0, 1.0, 0.5, 2.0)). Update post-coarse:
#   α: {α*−0.5, α*−0.25, α*, α*+0.25, α*+0.5} (clip ≥ 0)
#   β, γ, δ: 동일 패턴 (≥ 0)
# 5 × 5 × 5 × 5 = 625 combos
sweep:
  alpha: [0.5, 0.75, 1.0, 1.25, 1.5]
  beta:  [0.5, 0.75, 1.0, 1.25, 1.5]
  gamma: [0.0, 0.25, 0.5, 0.75, 1.0]
  delta: [1.5, 1.75, 2.0, 2.25, 2.5]

intents:
  - baseline
  - left_bias
  - right_bias
  - center_bias
  - avoid_steep
  - prefer_flat
  - short_path
  - energy_efficient
  - left_bias+avoid_steep
  - right_bias+prefer_flat
  - center_bias+prefer_flat
  - short_path+avoid_steep

horizon: 120
risk_threshold_deg: 15.0
seed: 42

balanced_selection:
  enabled: true
  feasibility_min: 0.90
  isr_min: 0.70
