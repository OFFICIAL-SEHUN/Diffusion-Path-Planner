# =============================================================================
# Text-guided diffusion — ResNet + frozen T5 features (t5-base)
# =============================================================================
# Usage:
#   python train.py --config configs/resnet_t5.yaml --data-dir data/raw --val-dir data/valid
# Resume: set training.resume below, or override with: --resume checkpoints/resnet_t5/epoch_*.pt
# Requires: pip install transformers (first run downloads t5-base from Hugging Face)
# =============================================================================

project_name: "DiffusionTextGuide_ResNet_T5"
seed: 42

data:
  img_size: 100
  horizon: 120
  num_samples: 100
  paths_per_terrain: 100
  cost_weight: 50.0
  min_distance_factor: 1.5

gradient:
  height_range: [0, 5]
  terrain_scales: [[20,10],[10,5],[5,2]]
  mass: 10.0
  gravity: 9.8
  limit_angle_deg: 25
  pixel_resolution: 0.5
  max_iterations: 20000

intent:
  cost_weights:
    alpha: 0.5
    beta: 1.75
    gamma: 1.5
    delta: 1.75
  risk_threshold_deg: 15.0

diffusion:
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.02

model:
  base_dim: 64
  time_embed_dim: 256
  image_feat_dim: 256
  visual_backbone: resnet
  timm_model_name: resnet18
  timm_pretrained: true
  text_encoder_type: t5_proj
  text_encoder:
    type: t5_proj
    model_name: t5-base
    batch_size: 64

training:
  epochs: 50000
  batch_size: 128
  learning_rate: 0.00003
  checkpoint_dir: "checkpoints/resnet_t5"
  model_name: "diffusion_textguide_resnet_t5.pt"
  log_interval: 1000
  use_amp: true
  # Path to epoch_*.pt (relative to diffusion_textguide/ or absolute). null = train from scratch.
  resume: null
# resume: "checkpoints/resnet_t5/epoch_5000.pt"

inference:
  show_progress: true

logging:
  val_loss_interval: 200
  val_interval: 200
  val_max_samples: 50
  log_dir: "logs/resnet_t5"
