# ─────────────────────────────────────────────────────────
# Exp 1 — Pareto Weight Sweep (coarse stage, 192 combos)
# ─────────────────────────────────────────────────────────
# Step cost is dimensionless (each term ∈ [0,1]):
#   ĉ_ij = α·d̂_ij + β·ê(s_j)·d̂_ij + γ·R̂(s_j) + δ·Î_j
#   d̂ ∈ [0,1]   (real_d / (√2·pixel_res))
#   ê ∈ [0,1]   (Go2 CoT poly normalized over [−s_lim, +s_lim])
#   R̂ ∈ [0,1]   (clip((|s|−τ_R)/(s_lim−τ_R), 0, 1), τ_R=15°, s_lim=25°)
#   Î ∈ [0,1]   (penalty intents only; modulators contribute 0)
#
# Therefore (α,β,γ,δ) ratios directly = each term's relative influence.
# Coarse grid sweeps a wide ratio range; refine stage zooms ±0.5 around best.
#
# Run:
#   python -m experiment.evaluators.pareto \
#       --config experiment/configs/pareto_sweep.yaml \
#       --output-dir results/pareto
# ─────────────────────────────────────────────────────────

terrain:
  num_terrains: 30
  img_size: 100
  height_range: [0, 5]
  terrain_scales: [[20, 10], [10, 5], [5, 2]]
  limit_angle_deg: 25
  pixel_resolution: 0.5
  max_iterations: 20000

# 3 × 4 × 4 × 4 = 192 combos (× 30 terrains × 12 intents)
sweep:
  # α: geodesic distance weight (baseline; α=0 → degenerate, α=1 = unit reference)
  alpha: [0.5, 1.0, 2.0]
  # β: CoT-along-distance weight (β·ê·d̂). β=0 → CoT 무시.
  # ê·d̂의 평균 effective scale은 ~0.3 이라 β는 다른 것보다 크게 잡음.
  beta:  [0.0, 0.5, 1.0, 2.0]
  # γ: risk (slope safety) weight. γ=0 → 위험 슬로프 무시 (단, limit_angle_deg는 hard cut).
  gamma: [0.0, 0.5, 1.0, 2.0]
  # δ: intent penalty weight. δ가 클수록 의도 추종 강함.
  # penalty intents가 path를 휘게 만들려면 α·d̂보다 충분히 커야 의미.
  delta: [0.5, 1.0, 2.0, 4.0]

# Mirrors scripts/generate_data.py INTENT_CATALOG (keep in sync).
intents:
  - baseline
  - left_bias
  - right_bias
  - center_bias
  - avoid_steep
  - prefer_flat
  - short_path
  - energy_efficient
  - left_bias+avoid_steep
  - right_bias+prefer_flat
  - center_bias+prefer_flat
  - short_path+avoid_steep

horizon: 120
risk_threshold_deg: 15.0
seed: 42

# ── Balanced selection (recommended) ──
# Step 1: per-intent floors — every intent must individually pass
#          feasibility ≥ 0.90  AND  ISR ≥ 0.70
# Step 2: among survivors, normalise (CoT↓, Risk↓, ISR↑) to [0,1],
#          pick the point closest to the utopia corner (all-best).
#          → "most balanced" weight, not biased toward any single metric.
balanced_selection:
  enabled: true
  feasibility_min: 0.90   # per intent (not average)
  isr_min: 0.70           # per intent (not average)

# ── Constrained min-CoT (optional, disabled by default) ──
# Keeps tuples where aggregated feasibility/ISR pass floors, then min CoT.
# constrained_selection:
#   enabled: true
#   feasibility_min: 0.95
#   isr_min: 0.80
#   aggregate: mean   # mean | min
